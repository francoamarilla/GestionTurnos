name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
      # Testcontainers uses the runner's own Docker daemon - no services: block needed.
      - run: ./mvnw -B test
        working-directory: backend

  # No API key needed: tests use a scripted LLM, including the eval harness.
  ai-service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: ai-service/pyproject.toml
      - run: pip install -e ".[evals]" pytest ruff mypy types-pyyaml
        working-directory: ai-service
      - run: ruff check . && ruff format --check .
        working-directory: ai-service
      - run: mypy app evals
        working-directory: ai-service
      - run: pytest -q
        working-directory: ai-service

  # The smoke evals against the real model: only when the agent changed and
  # the repo has an ANTHROPIC_API_KEY secret (they spend real tokens, cents).
  # Fails below 80% of scenarios passing.
  evals:
    needs: ai-service
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: gate
        run: |
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -n "$ANTHROPIC_API_KEY" ] && git diff --name-only "$base" HEAD 2>/dev/null | grep -qE '^ai-service/(app|evals)/'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.gate.outputs.run == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: ai-service/pyproject.toml
      - if: steps.gate.outputs.run == 'true'
        run: pip install -e ".[evals]" && python -m evals.run --tag smoke --min-pass 0.8 --out eval-report.json
        working-directory: ai-service
      - if: steps.gate.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: ai-service/eval-report.json

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm test
        working-directory: frontend
