spring.application.name=turnos-backend

# Spec section 11: all API errors as application/problem+json (RFC 7807).
spring.mvc.problemdetails.enabled=true

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/turnos}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:turnos_app}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:turnos_app}

# TenantContextFilter sets RLS's app.tenant_id GUC on the request's DB
# connection outside of any @Transactional (open-in-view's default lazy
# connection handling releases a connection back to the pool after every
# untransacted operation, e.g. every plain read-only repository call). With
# the default handling mode that means the GUC-setting call and the actual
# query can silently land on two different pooled connections - fine when
# the pool is idle and hands the same connection straight back, but under
# real concurrency a query can land on a connection another request already
# reset, making RLS filter out rows that are actually there (intermittent
# 404s like "Branch not found"). Holding one connection for the whole
# request (matching what open-in-view is commonly assumed to do) closes
# that gap.
spring.jpa.properties.hibernate.connection.handling_mode=IMMEDIATE_ACQUISITION_AND_HOLD

# Dev-only default secret. Override with JWT_SECRET in any real environment.
app.jwt.secret=${JWT_SECRET:YNHYwx3sd2i3qo8vz2YanUTjbSvTRJxgMBWRQphsWcM=}
app.jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:86400}

# Only seeds a SuperAdmin when both are set and no account with that email exists yet.
app.superadmin.email=${SUPERADMIN_EMAIL:}
app.superadmin.password=${SUPERADMIN_PASSWORD:}

# Spec section 10: structured (JSON) logs, tenantId included via MDC on
# every relevant entry (TenantContextFilter, the bot engine, the reminder
# job). Built into Boot's own logging support - no extra dependency.
logging.structured.format.console=logstash

# Healthcheck (spec section 10): process up + DB reachable are Actuator's
# own defaults; "reminder job running" is a custom indicator
# (ReminderJobHealthIndicator). No tracing, as the spec asks.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always

