spring.application.name=turnos-backend

# Render and most PaaS inject the port to listen on. 8080 keeps Compose and
# local runs exactly as they were.
server.port=${PORT:8080}

# Empty by default: every environment that exists today serves the SPA and
# the API from the same origin (nginx in Compose, Vite's proxy in dev), so
# no CORS headers are wanted there. A split deploy (SPA on one host, API on
# another) sets this to the SPA's origin. See SecurityConfig.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}

# postgres-init/init-app-role.sql creates btree_gist as the bootstrap
# superuser, but that only runs for Docker Compose, when the data volume is
# first initialized. A managed Postgres (Neon, RDS, Supabase) has no such
# hook, so a from-scratch deployment died in V7, on the appointment
# no-overlap exclusion constraint that needs gist over uuid.
#
# This runs on every connection Flyway opens, before any migration - which
# is why it is here and not a V__ migration: a migration numbered after V7
# is already too late, and one numbered before it would be out of order for
# every database that exists today. IF NOT EXISTS makes it a no-op where
# the extension is already installed, and btree_gist is a trusted extension
# (PG13+), so an ordinary role with CREATE on the database can install it -
# no superuser needed, which is what makes it work on Neon as neondb_owner.
spring.flyway.init-sqls=CREATE EXTENSION IF NOT EXISTS btree_gist

# Spec section 11: all API errors as application/problem+json (RFC 7807).
spring.mvc.problemdetails.enabled=true

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/turnos}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:turnos_app}
# No default, same reasoning as app.jwt.secret below. The url and username
# keep theirs: they are not secrets, and postgres-init/init-app-role.sql
# fixes the role name anyway.
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# TenantContextFilter sets RLS's app.tenant_id GUC on the request's DB
# connection outside of any @Transactional (open-in-view's default lazy
# connection handling releases a connection back to the pool after every
# untransacted operation, e.g. every plain read-only repository call). With
# the default handling mode that means the GUC-setting call and the actual
# query can silently land on two different pooled connections - fine when
# the pool is idle and hands the same connection straight back, but under
# real concurrency a query can land on a connection another request already
# reset, making RLS filter out rows that are actually there (intermittent
# 404s like "Branch not found"). Holding one connection for the whole
# request (matching what open-in-view is commonly assumed to do) closes
# that gap - together with TenantSessionBindingConfig, which binds the
# EntityManager (and so acquires that connection) in a filter that runs
# before TenantContextFilter. This property alone is not enough: Boot's
# default open-in-view interceptor only binds once the request reaches
# DispatcherServlet, i.e. after the GUCs were already set on a connection
# that went back to the pool.
spring.jpa.properties.hibernate.connection.handling_mode=IMMEDIATE_ACQUISITION_AND_HOLD

# No default on purpose: a baked-in key would be the same one in every
# deployment, and this repo is public. Unset = the context fails to start
# with "Could not resolve placeholder", which is the point. Compose sets a
# dev-only value; generate a real one with: openssl rand -base64 32
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:86400}

# AI assistant (ai-service/). Empty base URL = AI off: the public chat
# answers with a fixed message and nothing calls an LLM. The service token
# is the shared secret Spring sends to ai-service, which is public on Render.
app.ai.base-url=${AI_SERVICE_URL:}
app.ai.service-token=${AI_SERVICE_TOKEN:}
app.ai.timeout-seconds=${AI_SERVICE_TIMEOUT_SECONDS:45}
# Global LLM spend cap per UTC day, across all tenants (0 = none). The
# public demo sets one; per-tenant monthly budgets live in assistant_config.
app.ai.daily-budget-usd=${AI_DAILY_BUDGET_USD:0}
# Public chat: messages per minute per IP and per session.
app.chat.rate-limit-per-minute=${CHAT_RATE_LIMIT_PER_MINUTE:20}
# Cloudflare Turnstile secret. Empty = no captcha on new chat sessions.
app.turnstile.secret=${TURNSTILE_SECRET:}

# Behind Render's proxy the client IP is in X-Forwarded-For; the chat rate
# limit needs the real one. Keep "none" where nothing sets that header,
# or anyone could spoof their IP.
server.forward-headers-strategy=${FORWARD_HEADERS_STRATEGY:none}

# Only seeds a SuperAdmin when both are set and no account with that email exists yet.
app.superadmin.email=${SUPERADMIN_EMAIL:}
app.superadmin.password=${SUPERADMIN_PASSWORD:}

# Spec section 10: structured (JSON) logs, tenantId included via MDC on
# every relevant entry (TenantContextFilter, the bot engine, the reminder
# job). Built into Boot's own logging support - no extra dependency.
logging.structured.format.console=logstash

# Healthcheck (spec section 10): process up + DB reachable are Actuator's
# own defaults; "reminder job running" is a custom indicator
# (ReminderJobHealthIndicator). No tracing, as the spec asks.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always

# Adds /actuator/health/liveness, which reports process state only and does
# NOT touch the database - the right target for an uptime monitor that is
# just keeping a sleeping host awake. Plain /actuator/health still runs the
# DB and reminder-job indicators.
management.endpoint.health.probes.enabled=true

