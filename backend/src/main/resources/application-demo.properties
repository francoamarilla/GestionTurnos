# Public demo profile. Activated ONLY by SPRING_PROFILES_ACTIVE=demo in the
# demo host's environment - never from a file that local or production
# loads, so the same build serves both.
#
# Everything here is either a free-tier constraint or demo-data wiring; no
# business behaviour changes.

# The demo database (Neon free) suspends after ~5 minutes idle and every
# connection counts against a small ceiling, so the pool stays tiny and
# drops to zero connections when nothing is happening. minimum-idle=0 is
# what lets the database actually fall asleep.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:5}
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.idle-timeout=30000
# A suspended Neon branch takes a few seconds to wake up; the 30s default
# would surface as a 500 on the first request after an idle period.
spring.datasource.hikari.connection-timeout=30000

# Demo seed (DemoDataSeeder / DemoDataService). All of it from the
# environment: nothing here may carry a real credential.
app.demo.admin-email=${DEMO_ADMIN_EMAIL:}
app.demo.admin-password=${DEMO_ADMIN_PASSWORD:}
app.demo.reset-token=${DEMO_RESET_TOKEN:}
# false skips the reset on boot and leaves /api/demo/reset as the only way
# to regenerate - useful when restarts are frequent and the data is fine.
app.demo.seed-on-startup=${DEMO_SEED_ON_STARTUP:true}

# The reminder sweep would wake the database every 10 minutes for a demo
# whose messages go nowhere (LoggingWhatsAppProvider). Effectively off.
app.reminders.sweep-interval-ms=86400000
