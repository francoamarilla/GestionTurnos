# Render blueprint for the public demo backend.
#
# The database is NOT declared here: Neon's free tier is the demo's
# Postgres, so DATABASE_URL-style settings arrive as plain environment
# variables (see DEPLOY.md). Render's own free Postgres expires after 30
# days, which is why it is not used.
#
# Everything marked sync: false has to be typed into the Render dashboard
# once. Nothing secret belongs in this file - it is committed.
services:
  - type: web
    name: turnos-backend
    runtime: docker
    plan: free
    region: virginia
    rootDir: backend
    dockerfilePath: ./Dockerfile
    # Process-only: it does not touch Postgres, so the uptime monitor that
    # keeps this service awake never wakes the database as well.
    healthCheckPath: /actuator/health/liveness
    autoDeploy: false
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: demo
      # Neon's DIRECT connection string, never the -pooler one: the tenant
      # for Row-Level Security is set with a session-scoped set_config, and
      # a transaction pooler can hand that session to another request
      # between statements. See DEPLOY.md, "Por qué la conexión directa".
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: DEMO_ADMIN_EMAIL
        sync: false
      - key: DEMO_ADMIN_PASSWORD
        sync: false
      - key: DEMO_RESET_TOKEN
        generateValue: true
      # AI assistant. AI_SERVICE_URL is turnos-ai's public URL; leave it
      # empty to run the demo with the button bot only.
      - key: AI_SERVICE_URL
        sync: false
      # Same value as on turnos-ai: it is how that service knows the call
      # comes from this backend. Generate one: openssl rand -hex 32
      - key: AI_SERVICE_TOKEN
        sync: false
      # Global LLM spend cap per UTC day. Keep it small on a public demo.
      - key: AI_DAILY_BUDGET_USD
        value: "1"
      # Render's proxy puts the client IP in X-Forwarded-For: the chat
      # rate limit needs it.
      - key: FORWARD_HEADERS_STRATEGY
        value: framework
      # Cloudflare Turnstile secret for the public chat (optional).
      - key: TURNSTILE_SECRET
        sync: false

  # The AI agent (ai-service/, Python). Public on Render's free plan, so it
  # only answers with the shared AI_SERVICE_TOKEN; it never touches the
  # database, only the backend's /internal/agent/* API.
  - type: web
    name: turnos-ai
    runtime: docker
    plan: free
    region: virginia
    rootDir: ai-service
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: AI_MODEL
        value: claude-haiku-5-5
      - key: AI_SERVICE_TOKEN
        sync: false
      # turnos-backend's public URL, e.g. https://turnos-backend.onrender.com
      - key: CORE_BASE_URL
        sync: false
