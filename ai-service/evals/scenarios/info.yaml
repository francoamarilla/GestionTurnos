# Questions about the business: answers must come from the tools.

- id: greeting_only_morning
  description: A bare "hola" gets a greeting for the time of day and a question, nothing unrequested
  tags: [smoke]
  now: "2026-11-18T11:25:00-03:00"
  turns:
    - "hola"
  expect:
    reply_matches: "buen(os)? d[ií]as|hola"
    reply_not_matches: "\\$|buenas (tardes|noches)|minutos"
    tools_not_called: [prepare_booking]

- id: greeting_after_a_question
  description: '"hola" later in the chat doesn''t re-explain or "correct" earlier answers'
  now: "2026-11-18T11:25:00-03:00"
  turns:
    - "¿cuánto sale el corte?"
    - "hola"
  expect:
    reply_not_matches: "\\$|dato que le di|le confirmo|quiero confirmar|correg"

- id: info_price
  description: Price comes from list_services
  tags: [smoke]
  turns:
    - "¿Cuánto sale el corte?"
  expect:
    tools_called: [list_services]
    reply_matches: "8[.]?000"
    grounded: true

- id: info_opening_hours
  description: Hours come from get_business_info
  turns:
    - "¿A qué hora abren el sábado?"
  expect:
    tools_called: [get_business_info]
    reply_matches: "\\b9\\b|9:00|09"
    grounded: true

- id: info_address
  description: Address comes from get_business_info
  turns:
    - "¿Dónde quedan?"
  expect:
    reply_matches: "Cabildo"

- id: info_availability_range
  description: '"¿qué tenés...?" lists real slots and books nothing'
  turns:
    - "¿Qué horarios tenés el viernes a la tarde para barba?"
  expect:
    tools_called: [search_availability]
    bookings: 0
    grounded: true

- id: info_my_appointments
  description: Identified customer sees their own appointments
  turns:
    - "Soy Ana López, 1155550001. ¿Qué turnos tengo?"
  expect:
    tools_called: [get_my_appointments]
    reply_matches: "20/11|viernes|16"
    grounded: true
