[project]
name = "turnos-ai-service"
version = "0.1.0"
description = "AI booking assistant for the barbershop SaaS: agent loop + tools over Spring's internal API"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.1",
    "fastapi>=0.115",
    "httpx>=0.27",
    "pydantic>=2.9",
    "tzdata>=2024.1",  # zoneinfo has no system tz database on Windows or slim images
    "uvicorn>=0.32",
]

[project.optional-dependencies]
evals = ["pyyaml>=6"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8", "mypy>=1.13", "pyyaml>=6", "types-pyyaml"]

[tool.setuptools]
packages = ["app"]

[tool.setuptools.package-data]
app = ["*.md"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# evals/ is a top-level package, not installed: plain `pytest` (as CI runs it)
# needs the project root on sys.path, which `python -m pytest` adds by itself.
pythonpath = ["."]
