server {
    listen 80;

    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
    }

    location / {
        root /usr/share/nginx/html;
        # React Router (BrowserRouter): fall back to index.html for any
        # client-side route so a hard refresh on e.g. /agenda doesn't 404.
        try_files $uri /index.html;
    }
}
