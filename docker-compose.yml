services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: turnos
      POSTGRES_USER: turnos
      POSTGRES_PASSWORD: turnos
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U turnos -d turnos"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/turnos
      SPRING_DATASOURCE_USERNAME: turnos_app
      SPRING_DATASOURCE_PASSWORD: turnos_app
      SUPERADMIN_EMAIL: ${SUPERADMIN_EMAIL:-}
      SUPERADMIN_PASSWORD: ${SUPERADMIN_PASSWORD:-}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
