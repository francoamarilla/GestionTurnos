services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: turnos
      POSTGRES_USER: turnos
      POSTGRES_PASSWORD: turnos
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U turnos -d turnos"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/turnos
      SPRING_DATASOURCE_USERNAME: turnos_app
      # Must match the password postgres-init/init-app-role.sql gives the
      # role; both are dev-only, like POSTGRES_PASSWORD above.
      SPRING_DATASOURCE_PASSWORD: turnos_app
      # Dev-only, and public like the rest of this file - a real deployment
      # exports its own JWT_SECRET (openssl rand -base64 32).
      JWT_SECRET: ${JWT_SECRET:-5DSFVm4iJP/jHfZPM3//dzEMcBT10UUBTVAuDPc/L64=}
      SUPERADMIN_EMAIL: ${SUPERADMIN_EMAIL:-}
      SUPERADMIN_PASSWORD: ${SUPERADMIN_PASSWORD:-}
      AI_SERVICE_URL: http://ai:8000
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:-dev-only-ai-service-token}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  # No published port: only the backend talks to it. Without
  # ANTHROPIC_API_KEY in your shell every turn fails and the chat answers
  # with Spring's fixed fallback message.
  ai:
    build:
      context: ./ai-service
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-claude-haiku-5-5}
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:-dev-only-ai-service-token}
      CORE_BASE_URL: http://backend:8080

  frontend:
    build:
      context: ./frontend
    ports:
      - "8081:80"
    depends_on:
      - backend

volumes:
  postgres-data:
